# ============================================================================
# IoT-Based Health Monitoring System
# Oracle Database Connection Configuration
# ============================================================================
# Supports Oracle 11g, 12c, 18c, 19c, 21c, and 23c Free/XE
#
# Examples of Common Oracle JDBC URLs:
# 1. Oracle 19c/21c XE Plugged Database: jdbc:oracle:thin:@//localhost:1521/XEPDB1
# 2. Oracle 23c Free Pluggable Database:  jdbc:oracle:thin:@//localhost:1521/FREEPDB1
# 3. Oracle 11g XE / Standard SID:       jdbc:oracle:thin:@localhost:1521:XE
# 4. College Lab Remote Oracle Server:   jdbc:oracle:thin:@//192.168.1.100:1521/ORCL

db.driver=oracle.jdbc.OracleDriver
db.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
db.username=system
db.password=MySecurePassword123

# HTTP Application Server Port
server.port=8080

# Session Timeout in minutes
session.timeout.minutes=60
